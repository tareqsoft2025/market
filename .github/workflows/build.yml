name: Build

# Runs on every push / pull request: compiles the app, runs unit tests and
# uploads a debug APK you can install for testing (it installs as a separate
# app "com.tareqsoft.market.debug", so it never touches the real shop data).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check database schema is committed
        # Room writes the schema JSON to app/schemas. It must be committed so
        # future versions can write migrations that keep user data.
        run: |
          git add -N app/schemas || true
          if ! git diff --quiet -- app/schemas; then
            echo "::error::Database schema changed but app/schemas is not committed. Commit the files below and add a migration."
            git diff --stat -- app/schemas
            find app/schemas -name '*.json' -exec sh -c 'echo "==== $1"; cat "$1"; echo' _ {} \;
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: market-debug-apk
          path: app/build/outputs/apk/debug/*.apk
